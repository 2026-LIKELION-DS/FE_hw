<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카운트 다운 페이지</title>
    <link rel="stylesheet" href="countdown.css" />
</head>
<body>
    <div class="card">
        <div class="section">
            <div class="text">
                <h1 class="section_title">운영시간</h1>
                <p class="time">AM 07:00 ~ PM 11:00</p>
            </div>
        </div>
        <div class="line"></div>
        <div class="section">
            <div class="text">
                <h1 class="section_title">CountDown</h1>
                <div class="timer_group">
                    <p class="description">금일 마감까지 남은 시간: </p>
                    <p class="timer">0:0:0</p>
                </div>
            </div>
        </div>
    </div>
    <script src="countdown.js" defer></script>
</body>
</html>
